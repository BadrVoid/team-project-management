services:
  postgres:
    image: postgres:17
    container_name: team-project-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: team_project_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1122334455

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: